# Custom host-based authentication - overrides the image's generated default
# via the `hba_file` config parameter (see infrastructure/postgres/Dockerfile
# and the postgres service's `command:` in docker-compose.yml).
#
# Local (unix socket) connections stay trust - used by `pg_isready` in the
# container healthcheck and any `docker compose exec postgres psql`, and
# never leave the container's own filesystem namespace.
local   all             all                                     trust

# Network connections (backend, postgres_exporter) are REQUIRED to use TLS -
# `hostssl` (not `host`) means a client that doesn't negotiate SSL is
# rejected outright with "no pg_hba.conf entry", not silently downgraded to
# plaintext. Scoped to the secure_network bridge subnet only, since Postgres
# has no host port mapping and is unreachable from outside that network.
hostssl all             all             172.20.0.0/16           scram-sha-256

# Everything else (including any non-SSL attempt on this subnet) is denied
# by the absence of a matching rule - no fallback plaintext-allowed line.
